name: Phishio CI/CD Pipeline Local

on:
  push:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: Executada na nuvem do GitHub (gratuita e isolada)
  # -------------------------------------------------------------
  testes-e-validacao:
    name: Testar Código e Integridade
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Dependências e Testar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov pytest-asyncio
          python -m nltk.downloader stopwords punkt
          PYTHONPATH=.:./runtime pytest tests/ -v

  # -------------------------------------------------------------
  # ETAPA 2: Executada no seu computador local (via Self-Hosted Runner)
  # Só executa se os testes na nuvem passarem 100%!
  # -------------------------------------------------------------
  deploy-producao-local:
    name: Atualizar Instância de Produção Local
    needs: [testes-e-validacao]
    runs-on: self-hosted
    steps:
      - name: Fazer Deploy na Produção Local
        run: |
          echo "Atualizando código na pasta oficial do projeto..."
          cd ~/projetos/phishio
          git pull origin main
          echo "Recriando contêineres de Produção com Docker Compose..."
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build
          echo "Produção atualizada com sucesso na porta 8000!"
